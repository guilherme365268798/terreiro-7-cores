<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instituto 7 Cores • Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    .bg-roxo-preto {
      background-color: #000000;
      background-image:
        radial-gradient(circle at 20% 0%, rgba(124, 58, 237, 0.55) 0%, rgba(76, 29, 149, 0.35) 35%, rgba(0, 0, 0, 0) 70%),
        linear-gradient(180deg, #5b21b6 0%, #3b0764 26%, #140826 56%, #05020a 80%, #000000 100%);
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen bg-roxo-preto text-slate-100 flex items-center justify-center p-4">

  <main id="auth-screen" class="w-full max-w-md rounded-2xl border border-violet-500/30 bg-black/65 backdrop-blur-md p-6 sm:p-8 shadow-2xl space-y-6">
    <div class="flex items-center gap-3.5">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md shrink-0 overflow-hidden">
        <img
          src="logo.jpg"
          alt="Logo Instituto 7 Cores"
          class="w-full h-full object-cover"
          onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
        >
        <span class="hidden">7C</span>
      </div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight text-white">Instituto 7 Cores</h1>
        <p class="text-xs text-violet-200/80">Acesso restrito — Gestão do Terreiro</p>
      </div>
    </div>

    <form id="auth-form" class="space-y-4" novalidate>
      <div>
        <label for="loginUsuario" class="block text-xs font-semibold mb-1.5 text-slate-200">Utilizador ou E-mail</label>
        <input
          id="loginUsuario"
          name="username"
          type="text"
          required
          autocomplete="username"
          placeholder="Digite o utilizador ou e-mail"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div>
        <label for="loginSenha" class="block text-xs font-semibold mb-1.5 text-slate-200">Palavra-passe</label>
        <input
          id="loginSenha"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="Digite a palavra-passe"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div class="flex items-center justify-between gap-2 pt-0.5">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none text-xs text-slate-300">
          <input
            id="loginManterConectado"
            type="checkbox"
            checked
            class="w-4 h-4 rounded border-violet-500/40 bg-slate-900 text-violet-600 focus:ring-violet-500"
          >
          <span>Manter login e salvar acesso neste navegador</span>
        </label>
      </div>

      <p id="loginErro" class="hidden text-xs font-semibold text-rose-300 bg-rose-500/15 border border-rose-500/30 rounded-xl px-3.5 py-2.5">
        Utilizador ou palavra-passe inválidos.
      </p>

      <button
        type="submit"
        class="w-full py-2.5 px-4 rounded-xl text-sm font-bold bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white shadow-lg shadow-violet-950/50 transition"
      >
        Entrar no Painel
      </button>
    </form>
  </main>

  <script>
    const STORAGE_KEYS = {
      DATA: 'i7c_gestao_terreiro_data_v1',
      AUTH_SESSION: 'i7c_gestao_terreiro_auth_v1',
      AUTH_REMEMBER: 'i7c_gestao_terreiro_auth_remember_v1'
    };

    const DEFAULT_USERS = [
      {
        nome: 'dirigente',
        email: 'guilherme.curto2004@gmail.com',
        papel: 'Dirigente',
        senha: '7cores2026'
      }
    ];

    function getUsers() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.DATA);
        if (!raw) return DEFAULT_USERS;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.usuarios) && parsed.usuarios.length > 0) {
          return parsed.usuarios;
        }
        return DEFAULT_USERS;
      } catch (_) {
        return DEFAULT_USERS;
      }
    }

    function validarCredenciais(identificador, senhaDigitada) {
      const idLimpo = String(identificador || '').trim().toLowerCase();
      const senhaLimpa = String(senhaDigitada || '').trim();
      if (!idLimpo || !senhaLimpa) return null;

      const users = getUsers();
      return users.find((u) => {
        const matchUser =
          String(u.nome || u.Nome || '').trim().toLowerCase() === idLimpo ||
          String(u.email || u.Email || '').trim().toLowerCase() === idLimpo;
        const senhaUsuario = String(u.senha || u.Senha || u.password || '').trim() || '7cores2026';
        return matchUser && senhaUsuario === senhaLimpa;
      }) || null;
    }

    function salvarSessao(user, remember) {
      const payload = JSON.stringify({
        authenticated: true,
        user: user.nome || user.Nome || user.email || user.Email,
        identifier: user.email || user.Email || user.nome || user.Nome,
        at: new Date().toISOString()
      });
      try {
        sessionStorage.setItem(STORAGE_KEYS.AUTH_SESSION, payload);
        if (remember) {
          localStorage.setItem(STORAGE_KEYS.AUTH_REMEMBER, payload);
        } else {
          localStorage.removeItem(STORAGE_KEYS.AUTH_REMEMBER);
        }
      } catch (_) {}
    }

    function jaTemSessaoSalva() {
      try {
        const s = sessionStorage.getItem(STORAGE_KEYS.AUTH_SESSION);
        if (s && JSON.parse(s)?.authenticated === true) return true;
        const r = localStorage.getItem(STORAGE_KEYS.AUTH_REMEMBER);
        if (r && JSON.parse(r)?.authenticated === true) {
          sessionStorage.setItem(STORAGE_KEYS.AUTH_SESSION, r);
          return true;
        }
        return false;
      } catch (_) {
        return false;
      }
    }

    function irParaSite() {
      window.location.replace('site.html');
    }

    // Se já estiver marcado para manter conectado, entra direto no site.html
    if (jaTemSessaoSalva()) {
      irParaSite();
    } else {
      try {
        const savedRemember = localStorage.getItem(STORAGE_KEYS.AUTH_REMEMBER);
        if (savedRemember) {
          const parsed = JSON.parse(savedRemember);
          const inputUser = document.getElementById('loginUsuario');
          if (inputUser && parsed.identifier) {
            inputUser.value = parsed.identifier;
          }
        }
      } catch (_) {}
    }

    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const userVal = document.getElementById('loginUsuario').value;
      const passVal = document.getElementById('loginSenha').value;
      const rememberVal = document.getElementById('loginManterConectado')?.checked ?? true;
      const erroEl = document.getElementById('loginErro');

      const matched = validarCredenciais(userVal, passVal);
      if (!matched) {
        erroEl.classList.remove('hidden');
        return;
      }

      erroEl.classList.add('hidden');
      salvarSessao(matched, rememberVal);
      irParaSite();
    });
  </script>
</body>
</html>
