<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instituto 7 Cores • Acesso</title>
  <script type="text/javascript" src="https://me.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=0R6Oo3pF5o4VU_xVN4_6ZU-qV0RQkjWIQXO226LpP6QZX7CcvTBu1WrxcpLGTAMCM46mQQcfGFu2xgwqV8FF2s4V1uPxMxA_B1_WcwCXto2ASrkQXZcNcwhNRohur858Tz-AHs5tDsMAq0FWQQVwKZfKgJpsH0FPeuj3Yp-8VmlWk020pmcDK4f6KNya1E_9x6Ytjvr83Csz7l7RLPrB6wdQFKY_OW3xW_i4Qssco55EWcxSctVG0YH5PsdDYEXDq3amG7ql9pYcIwo1sC2yPjibWGOn-ZE6m5vsbSpERRcL1CJ-f_DSr3JyZg6cBpD32S6Uw-4t8EHqUrj03NKmgg" charset="UTF-8"></script><link rel="stylesheet" crossorigin="anonymous" href="https://me.kis.v2.scr.kaspersky-labs.com/E3E8934C-235A-4B0E-825A-35A08381A191/abn/main.css?attr=aHR0cHM6Ly9jb250cmlidXRpb24udXNlcmNvbnRlbnQuZ29vZ2xlLmNvbS9kb3dubG9hZD9jPUNneGlZWEprWDNOMGIzSmhaMlVTVUJJTmNtVnpjRzl1YzJWZlpHRjBZUm9fQ2pCbU5EUXhZMkZqTjJZMVpEQTNOekJqTURBd05qWXhNbVV4WlRreE5HRmtNekE0T0RRNFlqTXdOekV3TVRBM01UZ1NDeElIRVBTMDZkX0FIQmdCJmZpbGVuYW1lPWluZGV4X2F0dWFsaXphZG8tdjYuaHRtbCZvcGk9MTAzMTM1MDUw"/><script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    .bg-roxo-preto {
      background-color: #000000;
      background-image:
        radial-gradient(circle at 20% 0%, rgba(124, 58, 237, 0.55) 0%, rgba(76, 29, 149, 0.35) 35%, rgba(0, 0, 0, 0) 70%),
        linear-gradient(180deg, #5b21b6 0%, #3b0764 26%, #140826 56%, #05020a 80%, #000000 100%);
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen bg-roxo-preto text-slate-100 flex items-center justify-center p-4">

  <main id="auth-screen" class="w-full max-w-md rounded-2xl border border-violet-500/30 bg-black/65 backdrop-blur-md p-6 sm:p-8 shadow-2xl space-y-6">
    <div class="flex items-center gap-3.5">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md shrink-0 overflow-hidden border border-violet-400/30">
        <img
          id="brandLogoImg"
          src="logo.jpg"
          alt="Logotipo Instituto 7 Cores"
          class="w-full h-full object-cover"
          onerror="this.classList.add('hidden'); document.getElementById('logoFallback7C').classList.remove('hidden');"
        >
        <span id="logoFallback7C" class="hidden">7C</span>
      </div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight text-white">Instituto 7 Cores</h1>
        <p id="authSubtitle" class="text-xs text-violet-200/80">Cadastro de novo usuário — Gestão do Terreiro</p>
      </div>
    </div>

    <!-- CADASTRO INICIAL DE NOVO USUÁRIO (ABERTO POR PADRÃO PARA OUTRA PESSOA CADASTRAR) -->
    <form id="register-form" class="space-y-4" novalidate>
      <div>
        <label for="regNome" class="block text-xs font-semibold mb-1.5 text-slate-200">Nome / Utilizador *</label>
        <input
          id="regNome"
          type="text"
          required
          autocomplete="off"
          placeholder="Digite o nome da pessoa"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div>
        <label for="regEmail" class="block text-xs font-semibold mb-1.5 text-slate-200">Novo E-mail *</label>
        <input
          id="regEmail"
          type="email"
          required
          autocomplete="off"
          placeholder="novo.usuario@exemplo.com"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div>
        <label for="regSenha" class="block text-xs font-semibold mb-1.5 text-slate-200">Nova Senha *</label>
        <input
          id="regSenha"
          type="password"
          required
          minlength="4"
          autocomplete="new-password"
          placeholder="Crie uma senha (mínimo 4 caracteres)"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div>
        <label for="regSenhaConfirm" class="block text-xs font-semibold mb-1.5 text-slate-200">Confirmar Nova Senha *</label>
        <input
          id="regSenhaConfirm"
          type="password"
          required
          minlength="4"
          autocomplete="new-password"
          placeholder="Repita a nova senha"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label for="regPapel" class="block text-xs font-semibold mb-1.5 text-slate-200">Função na casa</label>
          <select
            id="regPapel"
            class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white focus:outline-none focus:ring-2 focus:ring-violet-500"
          >
            <option value="Membro" selected>Membro</option>
            <option value="Cambono">Cambono</option>
            <option value="Secretaria">Secretaria</option>
            <option value="Dirigente">Dirigente</option>
          </select>
        </div>

        <div>
          <label for="regWhatsapp" class="block text-xs font-semibold mb-1.5 text-slate-200">WhatsApp (opcional)</label>
          <input
            id="regWhatsapp"
            type="tel"
            autocomplete="off"
            placeholder="(11) 99999-9999"
            class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
          >
        </div>
      </div>

      <label class="inline-flex items-center gap-2 cursor-pointer select-none text-xs text-slate-300 pt-0.5">
        <input
          id="regManterConectado"
          type="checkbox"
          class="w-4 h-4 rounded border-violet-500/40 bg-slate-900 text-emerald-600 focus:ring-emerald-500"
        >
        <span>Manter conectado após cadastrar neste aparelho</span>
      </label>

      <p id="regErro" class="hidden text-xs font-semibold text-rose-300 bg-rose-500/15 border border-rose-500/30 rounded-xl px-3.5 py-2.5">
        Erro ao cadastrar.
      </p>

      <p id="regSucesso" class="hidden text-xs font-semibold text-emerald-300 bg-emerald-500/15 border border-emerald-500/30 rounded-xl px-3.5 py-2.5">
        Novo usuário salvo! Agora você já pode entrar com o e-mail e senha cadastrados.
      </p>

      <button
        type="submit"
        class="w-full py-2.5 px-4 rounded-xl text-sm font-bold bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-lg transition"
      >
        Cadastrar e Salvar em Usuários
      </button>

      <div class="pt-2 border-t border-violet-500/20 text-center">
        <button
          type="button"
          id="btnMostrarLogin"
          class="text-xs font-semibold text-violet-300 hover:text-white underline underline-offset-4 transition"
        >
          Já tenho cadastro • Entrar com e-mail e senha
        </button>
      </div>
    </form>

    <!-- FORMULÁRIO DE LOGIN (PARA QUEM JÁ TEM CADASTRO) -->
    <form id="auth-form" class="hidden space-y-4" novalidate>
      <div>
        <label for="loginUsuario" class="block text-xs font-semibold mb-1.5 text-slate-200">Utilizador ou E-mail</label>
        <input
          id="loginUsuario"
          name="username"
          type="text"
          required
          autocomplete="off"
          placeholder="Digite o utilizador ou e-mail"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div>
        <label for="loginSenha" class="block text-xs font-semibold mb-1.5 text-slate-200">Palavra-passe</label>
        <input
          id="loginSenha"
          name="password"
          type="password"
          required
          autocomplete="new-password"
          placeholder="Digite a palavra-passe"
          class="w-full px-3.5 py-2.5 rounded-xl text-sm border border-violet-500/30 bg-slate-900/90 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
        >
      </div>

      <div class="flex items-center justify-between gap-2 pt-0.5">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none text-xs text-slate-300">
          <input
            id="loginManterConectado"
            type="checkbox"
            class="w-4 h-4 rounded border-violet-500/40 bg-slate-900 text-violet-600 focus:ring-violet-500"
          >
          <span>Manter login e salvar acesso neste navegador</span>
        </label>
      </div>

      <p id="loginErro" class="hidden text-xs font-semibold text-rose-300 bg-rose-500/15 border border-rose-500/30 rounded-xl px-3.5 py-2.5">
        Utilizador ou palavra-passe inválidos.
      </p>

      <button
        type="submit"
        class="w-full py-2.5 px-4 rounded-xl text-sm font-bold bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white shadow-lg shadow-violet-950/50 transition"
      >
        Entrar no Painel
      </button>

      <div class="pt-2 border-t border-violet-500/20 text-center">
        <button
          type="button"
          id="btnMostrarCadastro"
          class="text-xs font-semibold text-violet-300 hover:text-white underline underline-offset-4 transition"
        >
          Cadastrar novo usuário (e-mail e senha)
        </button>
      </div>
    </form>
  </main>

  <script>
    const STORAGE_KEYS = {
      DATA: 'i7c_gestao_terreiro_data_v1',
      AUTH_SESSION: 'i7c_gestao_terreiro_auth_v1',
      AUTH_REMEMBER: 'i7c_gestao_terreiro_auth_remember_v1'
    };

    const DEFAULT_USERS = [
      {
        id: 'u-default-dirigente',
        nome: 'dirigente',
        Nome: 'dirigente',
        email: 'guilherme.curto2004@gmail.com',
        Email: 'guilherme.curto2004@gmail.com',
        papel: 'Dirigente',
        Cargo: 'Dirigente',
        senha: '7cores2026',
        acessoSite: true
      }
    ];

    function loadStateData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.DATA);
        if (!raw) {
          return { filhos: [], trabalhos: [], usuarios: [...DEFAULT_USERS] };
        }
        const parsed = JSON.parse(raw);
        return {
          filhos: Array.isArray(parsed.filhos) ? parsed.filhos : [],
          trabalhos: Array.isArray(parsed.trabalhos) ? parsed.trabalhos : [],
          usuarios: Array.isArray(parsed.usuarios) && parsed.usuarios.length > 0
            ? parsed.usuarios
            : [...DEFAULT_USERS]
        };
      } catch (_) {
        return { filhos: [], trabalhos: [], usuarios: [...DEFAULT_USERS] };
      }
    }

    function saveStateData(data) {
      try {
        localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify(data));
      } catch (_) {}
    }

    function validarCredenciais(identificador, senhaDigitada) {
      const idLimpo = String(identificador || '').trim().toLowerCase();
      const senhaLimpa = String(senhaDigitada || '').trim();
      if (!idLimpo || !senhaLimpa) return null;

      const users = loadStateData().usuarios;
      return users.find((u) => {
        const matchUser =
          String(u.nome || u.Nome || '').trim().toLowerCase() === idLimpo ||
          String(u.email || u.Email || '').trim().toLowerCase() === idLimpo;
        const senhaUsuario = String(u.senha || u.Senha || u.password || '').trim() || '7cores2026';
        return matchUser && senhaUsuario === senhaLimpa;
      }) || null;
    }

    function salvarSessao(user, remember) {
      const payload = JSON.stringify({
        authenticated: true,
        user: user.nome || user.Nome || user.email || user.Email,
        identifier: user.email || user.Email || user.nome || user.Nome,
        at: new Date().toISOString()
      });
      try {
        sessionStorage.setItem(STORAGE_KEYS.AUTH_SESSION, payload);
        if (remember) {
          localStorage.setItem(STORAGE_KEYS.AUTH_REMEMBER, payload);
        } else {
          localStorage.removeItem(STORAGE_KEYS.AUTH_REMEMBER);
        }
      } catch (_) {}
    }

    function limparSessaoAutomatica() {
      // Evita redirecionamento automático indesejado ao abrir index.html
      try {
        sessionStorage.removeItem(STORAGE_KEYS.AUTH_SESSION);
      } catch (_) {}
    }

    function irParaSite() {
      window.location.href = 'site.html';
    }

    const authForm = document.getElementById('auth-form');
    const registerForm = document.getElementById('register-form');
    const authSubtitle = document.getElementById('authSubtitle');
    const loginUsuarioInput = document.getElementById('loginUsuario');
    const loginSenhaInput = document.getElementById('loginSenha');
    const regNomeInput = document.getElementById('regNome');
    const regEmailInput = document.getElementById('regEmail');
    const regSenhaInput = document.getElementById('regSenha');
    const regSenhaConfirmInput = document.getElementById('regSenhaConfirm');
    const regWhatsappInput = document.getElementById('regWhatsapp');

    function limparCamposVisiveis() {
      if (loginUsuarioInput) loginUsuarioInput.value = '';
      if (loginSenhaInput) loginSenhaInput.value = '';
      if (regNomeInput) regNomeInput.value = '';
      if (regEmailInput) regEmailInput.value = '';
      if (regSenhaInput) regSenhaInput.value = '';
      if (regSenhaConfirmInput) regSenhaConfirmInput.value = '';
      if (regWhatsappInput) regWhatsappInput.value = '';
    }

    function alternarModo(modo) {
      document.getElementById('loginErro').classList.add('hidden');
      document.getElementById('regErro').classList.add('hidden');
      limparCamposVisiveis();
      if (modo === 'login') {
        registerForm.classList.add('hidden');
        authForm.classList.remove('hidden');
        authSubtitle.textContent = 'Entrar com cadastro existente — Gestão do Terreiro';
      } else {
        authForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        authSubtitle.textContent = 'Cadastro de novo usuário — Gestão do Terreiro';
      }
    }

    document.getElementById('btnMostrarLogin').addEventListener('click', () => alternarModo('login'));
    document.getElementById('btnMostrarCadastro').addEventListener('click', () => alternarModo('cadastro'));

    // Garante que ao abrir index.html NÃO vá direto para site.html nem preencha seu e-mail
    limparSessaoAutomatica();
    limparCamposVisiveis();
    window.addEventListener('DOMContentLoaded', limparCamposVisiveis);
    window.addEventListener('pageshow', () => {
      limparSessaoAutomatica();
      limparCamposVisiveis();
    });

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const userVal = loginUsuarioInput.value;
      const passVal = loginSenhaInput.value;
      const rememberVal = document.getElementById('loginManterConectado')?.checked ?? false;
      const erroEl = document.getElementById('loginErro');

      const matched = validarCredenciais(userVal, passVal);
      if (!matched) {
        erroEl.classList.remove('hidden');
        return;
      }

      erroEl.classList.add('hidden');
      salvarSessao(matched, rememberVal);
      irParaSite();
    });

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = regNomeInput.value.trim();
      const email = regEmailInput.value.trim();
      const senha = regSenhaInput.value.trim();
      const senhaConfirm = regSenhaConfirmInput.value.trim();
      const papel = document.getElementById('regPapel').value;
      const whatsapp = regWhatsappInput.value.trim();
      const rememberVal = document.getElementById('regManterConectado')?.checked ?? false;
      const regErroEl = document.getElementById('regErro');
      const regSucessoEl = document.getElementById('regSucesso');

      if (!nome || !email || !senha) {
        regSucessoEl.classList.add('hidden');
        regErroEl.textContent = 'Preencha nome, novo e-mail e nova senha.';
        regErroEl.classList.remove('hidden');
        return;
      }

      if (senha.length < 4) {
        regSucessoEl.classList.add('hidden');
        regErroEl.textContent = 'A nova senha deve ter pelo menos 4 caracteres.';
        regErroEl.classList.remove('hidden');
        return;
      }

      if (senha !== senhaConfirm) {
        regSucessoEl.classList.add('hidden');
        regErroEl.textContent = 'As senhas não coincidem.';
        regErroEl.classList.remove('hidden');
        return;
      }

      const data = loadStateData();
      const jaExiste = data.usuarios.some(
        (u) =>
          String(u.email || u.Email || '').trim().toLowerCase() === email.toLowerCase() ||
          String(u.nome || u.Nome || '').trim().toLowerCase() === nome.toLowerCase()
      );

      if (jaExiste) {
        regSucessoEl.classList.add('hidden');
        regErroEl.textContent = 'Já existe um usuário salvo com este nome ou e-mail.';
        regErroEl.classList.remove('hidden');
        return;
      }

      const novoUsuario = {
        id: 'u-' + Date.now(),
        nome,
        Nome: nome,
        email,
        Email: email,
        papel,
        Cargo: papel,
        senha,
        acessoSite: papel.toLowerCase() === 'dirigente',
        whatsapp,
        WhatsApp: whatsapp
      };

      data.usuarios.push(novoUsuario);
      saveStateData(data);

      regErroEl.classList.add('hidden');
      regSucessoEl.classList.remove('hidden');
      salvarSessao(novoUsuario, rememberVal);

      // Leva para a tela de login com o novo e-mail preenchido ou entra direto se marcado
      if (rememberVal) {
        irParaSite();
      } else {
        alternarModo('login');
        loginUsuarioInput.value = email;
      }
    });
  </script>
</body>
</html>
